<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta property="og:type" content="website"/>
<script nonce="aem">
  // Inject SEO metadata from page properties.
  // No se declaran aqui description/og:title/og:description/twitter:*: el backend ya los
  // renderiza y duplicarlos vacios rompe a getMetadata(), que une todos los metas con ", ".
  (function setSeoMetadata() {
    const readMeta = (selector) => document.querySelector(selector)?.content?.trim() || '';

    const writeMeta = (attr, name, content) => {
      const nodes = [...document.head.querySelectorAll(`meta[${attr}="${name}"]`)];

      if (!nodes.length) {
        const meta = document.createElement('meta');
        meta.setAttribute(attr, name);
        meta.setAttribute('content', content);
        document.head.append(meta);
        return;
      }

      nodes.forEach((node, index) => {
        if (index === 0) node.setAttribute('content', content);
        else node.remove();
      });
    };

    const metaTitle = readMeta('meta[name="meta-title"]')
      || readMeta('meta[property="og:title"]')
      || readMeta('meta[name="jcr:title"]');
    const metaDesc = readMeta('meta[name="meta-description"]')
      || readMeta('meta[name="description"]')
      || readMeta('meta[name="jcr:description"]');

    if (metaTitle) {
      document.title = metaTitle;
      writeMeta('property', 'og:title', metaTitle);
      writeMeta('name', 'twitter:title', metaTitle);
    }

    if (metaDesc) {
      writeMeta('name', 'description', metaDesc);
      writeMeta('property', 'og:description', metaDesc);
      writeMeta('name', 'twitter:description', metaDesc);
    }

    if (!document.head.querySelector('meta[name="twitter:card"], meta[property="twitter:card"]')) {
      writeMeta('name', 'twitter:card', 'summary_large_image');
    }
  })();
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
