<!--
  Mock local de la pagina 404 contribuida en AEM (/es-es/inspiration-guide/404) con la forma en
  que la entrega Edge Delivery pinta el bloque not-found: una fila por campo (title, subtitle,
  cta, image). Con "aem up --html-folder drafts" se sirve en http://localhost:3000/es-es/inspiration-guide/404
  y el 404.html del repo la carga al pedir cualquier ruta inexistente de /es-es/inspiration-guide/.
  Los textos son distintos de los placeholders a proposito, para comprobar que se usan los contribuidos.
-->
